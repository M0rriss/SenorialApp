<article class="profile-card">
  <div class="user-info">
    <div class="avatar-wrapper">
      <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/da0e47ee944dac3efc756625bf016fdec570824b699f81d8f93995b40015bdc2?apiKey=463a3b572a7c411f920925ed0322cb5e&" alt="Victor Abregu's profile picture" class="avatar" loading="lazy" />
      <div class="status-indicator status-green"></div>
    </div>
    <div class="user-details">
      <h2 class="user-name">Victor Abregu</h2>
      <p class="user-role">Administrador</p>
      <p class="user-email">{{email || 'example@gmail.com'}}</p>
    </div>
  </div>
  <button class="logout-button" aria-label="Logout">
    <i class="fa-solid fa-arrow-right-from-bracket logout-icon"(click)="openConfirmDialog()"></i>
    <span class="visually-hidden">Logout</span>
  </button>
</article>
<!-- Confirm Dialog -->
<div class="confirm-dialog-overlay" [ngClass]="{'show': isConfirmDialogOpen}">
  <div class="confirm-dialog">
    <h2 id="confirm-dialog-title" class="confirm-dialog-title">Log Out</h2>
    <p class="confirm-dialog-description">¿Estás seguro que quieres salir?</p>
    <div class="confirm-dialog-button-container">
      <button class="button confirm-dialog-confirm-button" (click)="confirmDelete()">Log Out</button>
      <button class="button confirm-dialog-cancel-button" (click)="closeConfirmDialog()">Cancelar</button>
    </div>
  </div>
</div>

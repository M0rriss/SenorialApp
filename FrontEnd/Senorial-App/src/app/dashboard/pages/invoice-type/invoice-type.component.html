<div class="main-container">
  <side-bar></side-bar>
  <section class="payment-container" *ngIf="selectedOption === 'boleta'">
    <div class="title-container">
      <div class="back-button" routerLink="/mesadetail">
        <i class="fa-solid fa-angle-left"></i>
      </div>
      <h1 class="payment-title">Boleta</h1>
    </div>
    <div class="payment-content">
      <form class="personal-data">
        <div class="personal-data-header">
          <h2 class="personal-data-title">Datos Personales</h2>
          <button class="search-button">Buscar Datos en Reniec</button>
        </div>
        <label for="dni" class="visually-hidden">DNI</label>
        <input type="text" id="dni" class="input-field dni-field" placeholder="DNI" [value]="dniValue" readonly />
        <label for="document" class="visually-hidden">Número de Documento</label>
        <input type="text" id="document" class="input-field document-field" placeholder="Número de Documento*" [(ngModel)]="documentValue" />
        <label for="name" class="visually-hidden">Nombre</label>
        <input type="text" id="name" class="input-field" placeholder="Nombre*" required />
        <label for="surname" class="visually-hidden">Apellido</label>
        <input type="text" id="surname" class="input-field" placeholder="Apellido*" required />
        <label for="email" class="visually-hidden">Email</label>
        <input type="email" id="email" class="input-field" placeholder="Email*" required />
      </form>
      <div class="separator"></div>
      <div class="payment-summary">
        <div class="summary-header">
          <p>Falta Pagar</p>
          <p class="amount-due">S/.68.00</p>
          <p class="payment-options-title">Elige los medios de pago</p>
        </div>
        <div class="payment-options">
          <div class="option-container" [class.active]="selectedPaymentOption === 'efectivo'" (click)="selectPaymentOption('efectivo')">
            <div class="option-icon" [class.inactive-option]="selectedPaymentOption !== 'efectivo'">
              <i class="fa-solid fa-coins"></i>
            </div>
            <p class="option-label">Efectivo</p>
          </div>
          <div class="option-container" [class.active]="selectedPaymentOption === 'tarjeta'" (click)="selectPaymentOption('tarjeta')">
            <div class="option-icon" [class.inactive-option]="selectedPaymentOption !== 'tarjeta'">
              <i class="fa-solid fa-credit-card"></i>
            </div>
            <p class="option-label">Tarjeta</p>
          </div>
          <div class="option-container" [class.active]="selectedPaymentOption === 'transferencia'" (click)="selectPaymentOption('transferencia')">
            <div class="option-icon" [class.inactive-option]="selectedPaymentOption !== 'transferencia'">
              <i class="fa-solid fa-money-bill-transfer"></i>
            </div>
            <p class="option-label">Transferencia</p>
          </div>
          <div class="option-container" [class.active]="selectedPaymentOption === 'descuento'" (click)="selectPaymentOption('descuento')">
            <div class="option-icon" [class.inactive-option]="selectedPaymentOption !== 'descuento'">
              <i class="fa-solid fa-percent"></i>
            </div>
            <p class="option-label">Descuento</p>
          </div>
        </div>
        <button class="pay-button" (click)="openModal()">Efectuar Pago</button>
      </div>
    </div>
  </section>

  <section class="payment-container" *ngIf="selectedOption === 'factura'">
    <div class="title-container">
      <div class="back-button">
        <i class="fa-solid fa-angle-left"></i>
      </div>
      <h1 class="payment-title">Factura</h1>
    </div>
    <div class="payment-content">
      <form class="personal-data">
        <div class="personal-data-header">
          <h2 class="personal-data-title">Datos Personales</h2>
          <button class="search-button" (click)="buscarDatosReniec()">Buscar Datos en Reniec</button>
        </div>
        <label for="ruc" class="visually-hidden">RUC</label>
        <input type="text" id="ruc" class="input-field ruc-field" placeholder="RUC" [value]="rucValue" readonly />
        <label for="document" class="visually-hidden">Número de Documento</label>
        <input type="text" id="document" class="input-field document-field" placeholder="Número de Documento*" [(ngModel)]="documentValue" />
        <label for="razon" class="visually-hidden">Razon Social</label>
        <input type="text" id="razon" class="input-field" placeholder="Razon Social*" required />
        <label for="name" class="visually-hidden">Nombre</label>
        <input type="text" id="name" class="input-field" placeholder="Nombre*" required />
        <label for="surname" class="visually-hidden">Apellido</label>
        <input type="text" id="surname" class="input-field" placeholder="Apellido*" required />
        <label for="email" class="visually-hidden">Email</label>
        <input type="email" id="email" class="input-field" placeholder="Email*" required />
      </form>
      <div class="separator"></div>
      <div class="payment-summary">
        <div class="summary-header">
          <p class="title-summary">Falta Pagar</p>
          <p class="amount-due">S/.68.00</p>
          <p class="payment-options-title">Elige los medios de pago</p>
        </div>
        <div class="payment-options">
          <div class="option-container" [class.active]="selectedPaymentOption === 'efectivo'" (click)="selectPaymentOption('efectivo')">
            <div class="option-icon" [class.inactive-option]="selectedPaymentOption !== 'efectivo'">
              <i class="fa-solid fa-coins"></i>
            </div>
            <p class="option-label">Efectivo</p>
          </div>
          <div class="option-container" [class.active]="selectedPaymentOption === 'tarjeta'" (click)="selectPaymentOption('tarjeta')">
            <div class="option-icon" [class.inactive-option]="selectedPaymentOption !== 'tarjeta'">
              <i class="fa-solid fa-credit-card"></i>
            </div>
            <p class="option-label">Tarjeta</p>
          </div>
          <div class="option-container" [class.active]="selectedPaymentOption === 'transferencia'" (click)="selectPaymentOption('transferencia')">
            <div class="option-icon" [class.inactive-option]="selectedPaymentOption !== 'transferencia'">
              <i class="fa-solid fa-money-bill-transfer"></i>
            </div>
            <p class="option-label">Transferencia</p>
          </div>
          <div class="option-container" [class.active]="selectedPaymentOption === 'descuento'" (click)="selectPaymentOption('descuento')">
            <div class="option-icon" [class.inactive-option]="selectedPaymentOption !== 'descuento'">
              <i class="fa-solid fa-percent"></i>
            </div>
            <p class="option-label">Descuento</p>
          </div>
        </div>
        <button class="pay-button" (click)="openModal()">Efectuar Pago</button>
      </div>
    </div>
  </section>
</div>

<!-- Modal -->
<div class="modal" *ngIf="isModalOpen" (click)="closeModal($event)">
  <section class="modal-content" (click)="$event.stopPropagation()">
    <h2 class="amount-input-label">Ingrese Monto</h2>
    <div class="amount-input-container">
      <input type="text" class="amount-value" [(ngModel)]="amount" placeholder="0" />
      <span class="currency-label">PEN</span>
    </div>
    <div class="change-container">
      <span class="change-label">Vuelto</span>
      <span class="change-amount">10.00 PEN</span>
    </div>
    <button class="pay-button" (click)="submitPayment()">Pagar</button>
  </section>
</div>

<section class="metodo-pago-section">
  <side-bar></side-bar>
  <div class="content">
    <h1 class="section-title">Método de Pago</h1>
    <table class="metodo-pago-table">
      <thead>
        <tr class="table-header">
          <th>Método de Pago</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (item of metodoPago; track $index){
          <tr class="metodo-pago-row">
            <td>{{item.descripcion}}</td>
            <td class="status-container">
              <label class="switch">
                <input type="checkbox" checked>
                <span class="slider round"></span>
              </label>
              <span class="status-label">{{item.estadoDescripcion}}</span>
            </td>
            <td>
              <div class="action-buttons">
                <i class="add-icon fa-solid fa-circle-plus" (click)="addMetodoPago()"></i>
                <i class="edit-icon fa-regular fa-pen-to-square" (click)="editMetodoPago()"></i>
                <i class="delete-icon fa-solid fa-trash" (click)="openConfirmDialog()"></i>
              </div>
            </td>
          </tr>
        }
        
          
        
        
        <!-- Más filas según sea necesario -->
      </tbody>
    </table>
  </div>
</section>

<!-- Modal para agregar/editar Método de Pago -->
<div class="dialog-overlay" [ngClass]="{'show': isModalOpen}">
  <div class="add-metodo-pago-dialog">
    <span class="close-button" (click)="closeDialog()">&times;</span>
    <h2 class="dialog-title">{{modalTitle}}</h2>
    <form [formGroup]="formMetodoPago" (submit)="crearMetodoPago()">
      <div class="form-row">
        <label for="metodo-pago" class="form-label">Método de Pago</label>
        <input formControlName="descripcion" type="text" id="metodo-pago" class="form-input" placeholder="Ingrese el método de pago" required>
      </div>
      <div class="form-row">
        <label for="estado" class="form-label">Estado</label>
        <input formControlName="estado" type="text" id="estado" class="form-input" placeholder="Ingrese el estado" required>
      </div>

      <div class="action-buttons">
        <button type="button" class="button discard-button" (click)="closeDialog()">Cancelar</button>
        <button type="submit" class="button add-metodo-pago-button">{{modalButtonText}}</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-dialog-overlay" [ngClass]="{'show': isConfirmDialogOpen}">
  <div class="confirm-dialog">
    <h2 id="confirm-dialog-title" class="confirm-dialog-title">¿Quieres eliminar el método de pago?</h2>
    <p class="confirm-dialog-description">¿Estás seguro que quieres eliminarlo?</p>
    <div class="confirm-dialog-button-container">
      <button class="button confirm-dialog-confirm-button" (click)="confirmDelete()">Sí</button>
      <button class="button confirm-dialog-cancel-button" (click)="closeConfirmDialog()">No</button>
    </div>
  </div>
</div>

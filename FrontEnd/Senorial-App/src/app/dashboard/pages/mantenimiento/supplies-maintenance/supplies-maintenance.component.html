<section class="insumos-section">
  <side-bar></side-bar>
  <div class="content">
    <h1 class="section-title">Insumos</h1>
    <div class="action-bar">
      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon" onclick="performSearch()"></i>
        <input type="text" class="search-input" placeholder="Buscar por Insumos o Unidad de Medida">
      </div>
    <div class="buttons">
      <button class="action-button"  (click)="addInsumo()">Agregar</button>
    </div>
    </div>
    <table class="insumos-table">
      <thead>
        <tr class="table-header">
          <th>Id</th>
          <th>Insumo</th>
          <th>Unidad de Medida</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (item of suministro.lista; track $index) {
          <tr class="insumo-row">
            <td>{{item.idInsumo}}</td>
            <td>{{item.insumoNombre}}</td>
            <td>{{item.unidadMedida}}</td>
            <td>
              <div class="action-buttons">
                <!-- <i class="add-icon fa-solid fa-circle-plus" (click)="addInsumo()"></i> -->
                <i class="edit-icon fa-regular fa-pen-to-square" (click)="editInsumo(item)"></i>
                <i class="delete-icon fa-solid fa-trash" (click)="openConfirmDialog()"></i>
              </div>
            </td>
          </tr>
        }

        <!-- Más filas según sea necesario -->
      </tbody>
    </table>
    <!-- Componente de Paginación -->
  <div class="pagination-container">
    <p-paginator
      [rows]="this.rows"
      [first]="this.first"
      [totalRecords]="this.suministro.totalRegistros"
      [rowsPerPageOptions]="[5, 10, 20]"
      (onPageChange)="onPageChange($event)"
    ></p-paginator>
  </div>
  </div>
</section>

<!-- Modal para agregar/editar insumo -->
<div class="dialog-overlay" [ngClass]="{'show': isModalOpen}">
  <div class="add-insumo-dialog">
    <span class="close-button" (click)="closeDialog()">&times;</span>
    <h2 class="dialog-title">{{modalTitle}}</h2>
    <form [formGroup]="formInsumo">
      <div class="form-row">
        <label for="insumo" class="form-label">Insumo</label>
        <input formControlName="nombre" type="text" id="insumo" class="form-input" placeholder="Ingrese el insumo" required>
      </div>
      <!-- AQUI VA PARA EL LISTADO DE INSUMOS -->
      <div class="form-row">
        <label for="unid-medida" class="form-label">Unid. Medida</label>
        <select formControlName="idUnidad" type="text" id="unid-medida" class="form-input" placeholder="Ingrese la unidad de medida" required>
          @for (item of this.unidad; track $index) {
            <option [value]="item.idUnidad">{{item.descripcion}}</option>
          }
        </select>
      </div>


      <div class="action-buttons">
        <button type="button" class="button discard-button" (click)="closeDialog()">Descartar</button>
        <button type="submit" class="button add-insumo-button" (click)="editarInsumo()">{{modalButtonText}}</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-dialog-overlay" [ngClass]="{'show': isConfirmDialogOpen}">
  <div class="confirm-dialog">
    <h2 id="confirm-dialog-title" class="confirm-dialog-title">¿Quieres eliminar el insumo?</h2>
    <p class="confirm-dialog-description">¿Estás seguro que quieres eliminarlo?</p>
    <div class="confirm-dialog-button-container">
      <button class="button confirm-dialog-confirm-button" (click)="confirmDelete()">Sí</button>
      <button class="button confirm-dialog-cancel-button" (click)="closeConfirmDialog()">No</button>
    </div>
  </div>
</div>
<p-toast/>

<section class="insumos-section">
  <side-bar></side-bar>
  <div class="content">
    <h1 class="section-title">Insumos</h1>
    <table class="insumos-table">
      <thead>
        <tr class="table-header">
          <th>Id</th>
          <th>Insumo</th>
          <th>Unidad de Medida</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr class="insumo-row">
          <td>#12312</td>
          <td>Papa</td>
          <td>Kg</td>
          <td>
            <div class="action-buttons">
              <i class="add-icon fa-solid fa-circle-plus" (click)="addInsumo()"></i>
              <i class="edit-icon fa-regular fa-pen-to-square" (click)="editInsumo()"></i>
              <i class="delete-icon fa-solid fa-trash" (click)="openConfirmDialog()"></i>
            </div>
          </td>
        </tr>
        <!-- Más filas según sea necesario -->
      </tbody>
    </table>
  </div>
</section>

<!-- Modal para agregar/editar insumo -->
<div class="dialog-overlay" [ngClass]="{'show': isModalOpen}">
  <div class="add-insumo-dialog">
    <span class="close-button" (click)="closeDialog()">&times;</span>
    <h2 class="dialog-title">{{modalTitle}}</h2>
    <form>
      <div class="form-row">
        <label for="insumo" class="form-label">Insumo</label>
        <input type="text" id="insumo" class="form-input" placeholder="Ingrese el insumo" required>
      </div>
      <div class="form-row">
        <label for="unid-medida" class="form-label">Unid. Medida</label>
        <input type="text" id="unid-medida" class="form-input" placeholder="Ingrese la unidad de medida" required>
      </div>

      <div class="action-buttons">
        <button type="button" class="button discard-button" (click)="closeDialog()">Descartar</button>
        <button type="submit" class="button add-insumo-button">{{modalButtonText}}</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-dialog-overlay" [ngClass]="{'show': isConfirmDialogOpen}">
  <div class="confirm-dialog">
    <h2 id="confirm-dialog-title" class="confirm-dialog-title">¿Quieres eliminar el insumo?</h2>
    <p class="confirm-dialog-description">¿Estás seguro que quieres eliminarlo?</p>
    <div class="confirm-dialog-button-container">
      <button class="button confirm-dialog-confirm-button" (click)="confirmDelete()">Sí</button>
      <button class="button confirm-dialog-cancel-button" (click)="closeConfirmDialog()">No</button>
    </div>
  </div>
</div>

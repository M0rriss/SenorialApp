<section class="hamburger-section">
  <div class="hamburger-container">
    <div class="hamburger-content">
      <div class="hamburger-image-column">
        <div class="hamburger-image-wrapper">
          <img loading="lazy" src="./BurgerPage2.svg" class="hamburger-image" alt="Hamburger" />
          <div class="hamburger-details">
            <h2 class="hamburger-name">Hamburguesa</h2>
            <p class="hamburger-price">S/. 10.90</p>
          </div>
        </div>
      </div>
      <div class="hamburger-info-column">
        <div class="hamburger-info-wrapper">
          <div class="hamburger-info-content">
            <h1 class="hamburger-title">Hamburguesa</h1>
            <div class="hamburger-price-info">
              <span class="price-label">Precio</span>
              <span class="price-value">S/. 10.90</span>
            </div>
            <div class="quantity-controls">
              <div class="quantity-selector">
                <button class="decrease-button" aria-label="Decrease quantity">
                  <i class="fa-solid fa-minus"></i>
                </button>
                <span class="quantity-value">2</span>
                <button class="increase-button" aria-label="Increase quantity">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
              <button class="comment-button">Comentario</button>
            </div>
            <button class="add-to-cart-button">Agregar al carrito</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

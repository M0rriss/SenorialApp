<section class="login-container">
    <div class="login-wrapper">
      <header class="header-container">
        <div class="back-button-container">
          <a href="#" class="back-button">
            <i class="fa-solid fa-angle-left back-icon"></i>
            <span class="back-text">Volver</span>
          </a>
        </div>
        <div class="image-container">
          <img loading="lazy" src="./SenorialLogoBW.svg" class="header-image" alt="Login header illustration" />
        </div>
      </header>
      <main class="login-form-container">
        <h1 class="login-title">Solo el personal autorizado podra ingresar por aqui:</h1>
        <form>
          <label for="email" class="visually-hidden">Email del persona</label>
          <input type="email" id="email" class="input-field" placeholder="Email del personal" required />
          
          <div class="password-field">
            <label for="password" class="visually-hidden">Password</label>
            <input type="password" id="password" class="password-text" placeholder="Password" required />
            <i class="fa-solid fa-eye password-icon" id="toggle-password"></i>
          </div>
          
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          
          <div class="social-login">
            <span class="social-login-text">Inicia sesión con:</span>
            <img loading="lazy" src="./googleIconWeb.svg" class="social-icon" alt="Social login option" />
          </div>
          
          <button type="submit" class="login-button">Ingresar</button>
        </form>
       
      </main>
    </div>
  </section>
